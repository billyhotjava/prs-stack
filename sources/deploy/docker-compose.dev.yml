name: prs-dev

services:
  prs-pg:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${PRS_PG_DB:-prs}
      POSTGRES_USER: ${PRS_PG_USER:-prs}
      POSTGRES_PASSWORD: ${PRS_PG_PASSWORD:-prs-dev-pw}
    volumes:
      # PG18 breaking change：挂载点必须为父目录，数据放自动子目录（勿挂 .../data）
      - prs-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRS_PG_USER:-prs} -d ${PRS_PG_DB:-prs}"]
      interval: 5s
      timeout: 3s
      retries: 10

  prs-valkey:
    image: valkey/valkey:9.1.2
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - prs-valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prs-keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${PRS_KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PRS_KC_ADMIN_PW:-admin-dev-pw}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${PRS_KC_PORT:-38082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20

  prs-traefik:
    image: traefik:v3.7.13
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    ports:
      - "${PRS_EDGE_PORT:-38080}:80"
      - "${PRS_DASH_PORT:-38081}:8080"
    depends_on:
      prs-auth:
        condition: service_started
      prs-shadow:
        condition: service_started

  prs-auth:
    build:
      context: ..
      dockerfile: ./prs-auth/Dockerfile
    environment:
      PRS_AUTH_ISSUER: http://prs-keycloak:8080/realms/flower-test
      PRS_AUTH_TRUSTED_ISSUERS: http://localhost:38082/realms/flower-test
      PRS_VALKEY_HOST: prs-valkey
      LOGGING_LEVEL_COM_YUZHI_PRS_AUTH: debug
    stop_grace_period: 35s
    depends_on:
      prs-valkey:
        condition: service_healthy
      prs-keycloak:
        condition: service_healthy

  prs-shadow:
    build:
      context: ..
      dockerfile: ./prs-shadow/Dockerfile
    stop_grace_period: 35s
    depends_on:
      prs-auth:
        condition: service_started

  prs-platform:
    build:
      context: ..
      dockerfile: ./prs-platform/Dockerfile
    environment:
      PRS_PG_HOST: prs-pg
      PRS_PG_DB: ${PRS_PG_DB:-prs}
      PRS_PG_USER: ${PRS_PG_USER:-prs_app}
      PRS_PG_PASSWORD: ${PRS_PG_PASSWORD:-prs-dev-pw}
    stop_grace_period: 35s
    depends_on:
      prs-pg:
        condition: service_healthy

  prs-project:
    build:
      context: ..
      dockerfile: ./prs-project/Dockerfile
    environment:
      PRS_PG_HOST: prs-pg
      PRS_PG_DB: ${PRS_PG_DB:-prs}
      PRS_PG_USER: ${PRS_PG_USER:-prs_app}
      PRS_PG_PASSWORD: ${PRS_PG_PASSWORD:-prs-dev-pw}
      PRS_LEGACY_URL: ${PRS_LEGACY_URL:-}
      PRS_LEGACY_USER: ${PRS_LEGACY_USER:-}
      PRS_LEGACY_PASSWORD: ${PRS_LEGACY_PASSWORD:-}
      PRS_SYNC_DEFAULT_TENANT: ${PRS_SYNC_DEFAULT_TENANT:-1}
    stop_grace_period: 35s
    depends_on:
      prs-pg:
        condition: service_healthy

volumes:
  prs-pg-data:
  prs-valkey-data:
