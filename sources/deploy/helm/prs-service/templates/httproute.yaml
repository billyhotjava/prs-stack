{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  parentRefs:
    {{- toYaml .Values.parentRefs | nindent 4 }}
  {{- if .Values.hostnames }}
  hostnames:
    {{- toYaml .Values.hostnames | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.pathPrefix }}
      backendRefs:
        - name: {{ .Values.name }}
          port: 80
{{- end }}
