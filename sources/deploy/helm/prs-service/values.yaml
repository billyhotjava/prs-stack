# 默认值（dev）。生产/私有化用 --values 覆盖（见 README 对照表）。
name: prs-shadow
image:
  repository: prs-shadow
  tag: 1.0.0-SNAPSHOT
  pullPolicy: IfNotPresent
port: 8083
replicaCount: 1
env: []
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
terminationGracePeriodSeconds: 35
probes:
  liveness: /actuator/health/liveness
  readiness: /actuator/health/readiness
otel:
  enabled: true
httproute:
  enabled: true
  parentRefs:
    - name: prs-gateway
  hostnames: []
  pathPrefix: /api/
