server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: prs-platform
  datasource:
    url: jdbc:postgresql://${PRS_PG_HOST:localhost}:${PRS_PG_PORT:5432}/${PRS_PG_DB:prs}
    username: ${PRS_PG_USER:prs}
    password: ${PRS_PG_PASSWORD:prs}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  lifecycle:
    timeout-per-shutdown-phase: 30s

prs:
  openapi:
    title: PRS Platform API

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
