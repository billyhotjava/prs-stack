services:
  prs-backend:
    image: ${PRS_BACKEND_IMAGE:-prs-backend:local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
    ports:
      - "${PRS_BACKEND_PORT:-18080}:8080"

  prs-frontend:
    image: ${PRS_FRONTEND_IMAGE:-prs-frontend:local}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - prs-backend
    ports:
      - "${PRS_FRONTEND_PORT:-14173}:80"
